name: Build and deploy main
on:
  push:
    branches:
      - main
  workflow_dispatch:
jobs:
  ci:
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: deploy-prod
      cancel-in-progress: false # Let in-flight deploys finish
    timeout-minutes: 15
    permissions:
      contents: 'read'
      id-token: 'write' # Required for OIDC authentication to Nais
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create frontend SBOM
        uses: nais/docker-build-push@423a915c9b72edf2ba848b88171ccb0489e2a40a # v0
        with:
          team: appsec
          push_image: false
          pull: true
          target: sbom
          salsa: false
          outputs: type=local,dest=sbom-output
      - name: Build and push image
        uses: nais/docker-build-push@423a915c9b72edf2ba848b88171ccb0489e2a40a # v0
        id: docker-push
        with:
          team: appsec
          push_image: true
          pull: true
          additional_sboms: sbom-output/frontend.cdx.json
      - name: Deploy to prod-gcp
        uses: nais/deploy/actions/deploy@7ad7c2b833e1db74a80954e3ee6bb6ac060a8ae7 # v2
        env:
          CLUSTER: prod-gcp
          RESOURCE: nais.yaml
          IMAGE: ${{ steps.docker-push.outputs.image }}
