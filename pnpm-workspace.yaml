allowBuilds:
  core-js: false
engineStrict: true
trustPolicyExclude:
  - 'detect-port@1.6.1'
  - 'semver@6.3.1'
preferFrozenLockfile: true
# Hoist packages that need to be resolvable at the root (Docusaurus internals + webpack/babel/postcss)
publicHoistPattern:
  - "*webpack*"
  - "*babel*"
  - "*postcss*"
  - "*docusaurus*"
  - lunr
  - lunr-languages
