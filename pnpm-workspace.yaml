allowBuilds:
  core-js: false
  libxmljs2: false
engineStrict: true
trustPolicyExclude:
  - 'detect-port@1.6.1'
  - 'semver@6.3.1'
preferFrozenLockfile: true
# Hoist packages that need to be resolvable at the root (Docusaurus internals + webpack/babel/postcss)
publicHoistPattern:
  - "*webpack*"
  - "*babel*"
  - "*postcss*"
  - "*docusaurus*"
  - lunr
  - lunr-languages
minimumReleaseAgeExclude:
  - serialize-javascript@7.0.3 || 7.0.5
  - uuid@11.1.1
  - fast-uri@3.1.4 || 3.1.5
  - brace-expansion@1.1.17 || 1.1.18
  - postcss@8.5.23
  - mermaid@11.16.1
  - js-yaml@3.15.1 || 4.3.1
  - dompurify@3.4.13
  - image-size@2.0.3
  - nanoid@3.3.18
