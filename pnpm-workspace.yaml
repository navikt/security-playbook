allowBuilds:
  core-js: false
  libxmljs2: false
engineStrict: true
trustPolicyExclude:
  - 'detect-port@1.6.1'
  - 'semver@6.3.1'
preferFrozenLockfile: true
# Hoist packages that need to be resolvable at the root (Docusaurus internals + webpack/babel/postcss)
publicHoistPattern:
  - "*webpack*"
  - "*babel*"
  - "*postcss*"
  - "*docusaurus*"
  - lunr
  - lunr-languages
minimumReleaseAgeExclude:
  - serialize-javascript@7.0.3 || 7.0.5 || 7.1.3
  - uuid@11.1.1
  - fast-uri@3.1.4 || 3.1.5 || 3.1.9
  - brace-expansion@1.1.17 || 1.1.18 || 1.1.19 || 1.1.20 || 1.1.21 || 2.1.5 || 2.1.6 || 2.1.7
  - postcss@8.5.23
  - mermaid@11.16.1
  - js-yaml@3.15.1 || 4.3.1 || 4.3.2
  - dompurify@3.4.13 || 3.4.17
  - image-size@2.0.3
  - nanoid@3.3.18
  - qs@6.15.4 || 6.16.0
  - katex@0.18.2
  - postcss-selector-parser@7.1.6
  - tinypool@2.1.1 || 2.1.2
  - ip-address@10.7.4
  - body-parser@1.20.9
overrides:
  js-yaml@>=4.0.0 <4.3.2: ^4.3.2
  katex@>=0.11.0 <0.18.2: ^0.18.2
  postcss-selector-parser@<7.1.6: ^7.1.6
  qs@>=2.2.5 <6.16.0: ^6.16.0
  qs@>=6.14.2 <=6.15.3: ^6.15.4
  serialize-javascript@<7.1.3: ^7.1.3
  serialize-javascript@<=7.0.2: ^7.0.3
  serialize-javascript@>=5.0.0 <7.0.5: ^7.0.5
  tinypool@<2.1.2: ^2.1.2
  tinypool@<=2.1.0: ^2.1.1
  uuid@<11.1.1: ^11.1.1
