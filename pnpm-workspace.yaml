allowBuilds:
  core-js: false
engineStrict: true
minimumReleaseAgeExclude:
  - webpack-dev-server@5.2.4
  - ws@8.20.1
  - uuid@11.1.1
  - qs@6.15.2
  - brace-expansion@5.0.6
  - shell-quote@1.8.4
  - joi@17.13.4
overrides:
  brace-expansion@<1.1.13: ">=1.1.13"
  dompurify@<3.4.0: ">=3.4.0"
  dompurify@<=3.3.3: ">=3.4.0"
  dompurify@>=1.0.10 <3.4.0: ">=3.4.0"
  dompurify@>=3.0.1 <3.4.0: ">=3.4.0"
  follow-redirects@<=1.15.11: ">=1.16.0"
  lodash-es@<=4.17.23: ">=4.18.0"
  lodash-es@>=4.0.0 <=4.17.22: ">=4.17.23"
  lodash-es@>=4.0.0 <=4.17.23: ">=4.18.0"
  lodash@<=4.17.23: ">=4.18.0"
  lodash@>=4.0.0 <=4.17.23: ">=4.18.0"
  minimatch@<3.1.3: ">=3.1.3"
  minimatch@<3.1.4: ">=3.1.4"
  node-forge@<1.4.0: ">=1.4.0"
  node-forge@<=1.3.3: ">=1.4.0"
  express@4.22.1>path-to-regexp: "0.1.13"
  postcss@<8.5.10: ">=8.5.10"
  qs@<6.14.1: ">=6.14.1"
  qs@>=6.7.0 <=6.14.1: ">=6.14.2"
  serialize-javascript@<7.0.5: ">=7.0.5"
  serialize-javascript@<=7.0.2: ">=7.0.3"
  uuid@>=11.0.0 <11.1.1: ">=11.1.1"
preferFrozenLockfile: true
# Hoist packages that need to be resolvable at the root (Docusaurus internals + webpack/babel/postcss)
publicHoistPattern:
  - "*webpack*"
  - "*babel*"
  - "*postcss*"
  - "*docusaurus*"
  - lunr
  - lunr-languages
