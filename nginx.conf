server {
    listen 8080;
    port_in_redirect off;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://cdn.nav.no; connect-src https://reops-event-proxy.nav.no; upgrade-insecure-requests; block-all-mixed-content";
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()";

    location /isalive {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    location /isready {
        access_log off;
        default_type text/plain;
        return 200 'OK';
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
